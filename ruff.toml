# Lint config for the PEP 723 scripts. CI runs a pinned ruff (see ci.yml) with
# its default rule set, so a ruff upgrade is a deliberate, reviewed bump.
# Edvantage fork: the scripts run with the system python3, so the floor is 3.9;
# vendor/ is third-party code (PyYAML) and is not linted.
target-version = "py39"
extend-exclude = ["vendor"]

# Tests are development tooling run with uv (some use tomllib), not shipped scripts.
[per-file-target-version]
"tests/**" = "py311"
